# wrangler.toml
# Cloudflare Workers config for the vinext build (main = vinext/server/fetch-handler,
# assets = dist/client). NEXT_INC_CACHE_R2_BUCKET per env is the ISR data cache (r2DataAdapter).

compatibility_date = "2025-06-13"
workers_dev = false
main = "vinext/server/fetch-handler"
name = "portfolio"
upload_source_maps = true

compatibility_flags = [
	"nodejs_compat",
	"nodejs_compat_populate_process_env",
	"global_fetch_strictly_public",
]

[images]
binding = "IMAGES"

[cache]
enabled = true

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "portfolio-cache"
preview_bucket_name = "local-prod-cache-bucket"

[[d1_databases]]
binding = "ERRORS_DB"
database_name = "portfolio-errors"
database_id = "692825d4-52d1-4ecf-ba7a-6f346e150cba"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "portfolio"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[migrations]]
tag = "v2"
deleted_classes = ["DOQueueHandler"]

# Assets configuration
[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = false

# Observability (Logging and Monitoring)
[observability]
enabled = true
head_sampling_rate = 0.1

[placement]
mode = "smart"

[env.development]
name = "portfolio-development"

[env.development.images]
binding = "IMAGES"

[env.development.cache]
enabled = true

[[env.development.r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "dev-portfolio-cache"
preview_bucket_name = "local-dev-cache-bucket"

[[env.development.d1_databases]]
binding = "ERRORS_DB"
database_name = "portfolio-errors"
database_id = "692825d4-52d1-4ecf-ba7a-6f346e150cba"

[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[env.development.migrations]]
tag = "v2"
deleted_classes = ["DOQueueHandler"]

[[env.development.services]]
binding = "WORKER_SELF_REFERENCE"
service = "portfolio-development"