# wrangler.toml
# Cloudflare Workers config for the vinext build (main = vinext/server/fetch-handler,
# assets = dist/client). VINEXT_KV_CACHE per env is the ISR data cache (kvDataAdapter),
# replacing the old OpenNext R2 incremental cache.

compatibility_date = "2025-06-13"
workers_dev = false
main = "vinext/server/fetch-handler"
name = "portfolio"
upload_source_maps = true

compatibility_flags = [
	"nodejs_compat",
	"nodejs_compat_populate_process_env",
	"global_fetch_strictly_public",
]

[images]
binding = "IMAGES"

[cache]
enabled = true

[[kv_namespaces]]
binding = "VINEXT_KV_CACHE"
id = "8be5f0ddeded42e99aae36d21c4f7814"

[[d1_databases]]
binding = "ERRORS_DB"
database_name = "portfolio-errors"
database_id = "692825d4-52d1-4ecf-ba7a-6f346e150cba"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "portfolio"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[migrations]]
tag = "v2"
deleted_classes = ["DOQueueHandler"]

# Assets configuration
[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/"]

# Observability (Logging and Monitoring)
[observability]
enabled = true
head_sampling_rate = 0.1

[placement]
mode = "smart"

[env.development]
name = "portfolio-development"

[env.development.images]
binding = "IMAGES"

[env.development.cache]
enabled = true

[[env.development.kv_namespaces]]
binding = "VINEXT_KV_CACHE"
id = "9375d3c09d49430c9215c6b7a42f5350"

[[env.development.d1_databases]]
binding = "ERRORS_DB"
database_name = "portfolio-errors"
database_id = "692825d4-52d1-4ecf-ba7a-6f346e150cba"

[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[env.development.migrations]]
tag = "v2"
deleted_classes = ["DOQueueHandler"]

[[env.development.services]]
binding = "WORKER_SELF_REFERENCE"
service = "portfolio-development"